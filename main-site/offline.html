<!doctype html>
<html lang="en">

<head>
    <script>
        /* Pre-paint theme resolution. The two hours match LIGHT_FROM_HOUR and
           LIGHT_UNTIL_HOUR in /js/theme.js; change them together. */
        (function () {
            var k = "uwusports";
            var m = localStorage.getItem(k + ".mode") || "light";

            document.documentElement.setAttribute("data-mode-preference", m);
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
            }

            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
        })();
    </script>

    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>Offline | uwuSports</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="uwuSports is offline and has nothing saved for this view yet.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Offline | uwuSports" />
    <meta property="og:site_name" content="UwU Apps" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Jua">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="theme-color" content="#ccffcc" />

    <link rel="apple-touch-icon" href="/USC-192.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/USC-main.png">
    <meta property="og:image" content="/USC-main.png" />
</head>

<body>
    <main class="wrap">
        <div class="state glass">
            <span class="state-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M3 3l18 18" />
                    <path d="M8.3 8.3A4.5 4.5 0 0 0 7 17h9.2" />
                    <path d="M11.4 5.2A5.5 5.5 0 0 1 20 10a4 4 0 0 1 .9 7.5" />
                </svg>
            </span>
            <h1 class="state-title">You are offline</h1>
            <p class="state-body">
                uwuSports has not saved this view yet, so there is nothing to show. Open the app again
                once you have a connection and the last fixtures will be kept for next time.
            </p>
            <a class="search-submit" href="/">Back to uwuSports</a>
        </div>
    </main>
</body>

</html>
